<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1AD3BB" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#088BF5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowCenter)"/>

  <!-- 2. Technical Coordinate Grid -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.12">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="410" x2="1200" y2="410"/>
  </g>

  <!-- 3. TOP PILL: 100% Free & Open Source -->
  <g transform="translate(600, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#064E3B" fill-opacity="0.8" stroke="#10B981" stroke-width="1"/>
    <circle cx="-115" cy="0" r="4" fill="#34D399"/>
    <text x="-100" y="4" font-size="11" font-weight="700" fill="#A7F3D0" letter-spacing="0.5">100% FREE &amp; OPEN SOURCE · LGPL-3</text>
  </g>

  <!-- 4. HERO BRANDING: Interlocking Prism Logo & Typography -->
  <g transform="translate(600, 150)">
    <!-- Healthcare Geometric Prism Logo (80x80) -->
    <g transform="translate(-40, -68)">
      <svg width="80" height="80" viewBox="0 0 50 50">
        <path d="M9 7h16l-8 18H5a4 4 0 0 1-4-4V11a4 4 0 0 1 4-4h4Z" fill="#985184"/>
        <path d="M25 7h20a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H33l-8-18Z" fill="#FBB945"/>
        <path d="M17 25l8-18 16 18-8 18H17Z" fill="#1AD3BB"/>
        <path d="M25 25l8 18H17l8-18Z" fill="#005E7A"/>
        <path d="M33 25h12a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H25l8-18Z" fill="#088BF5"/>
        <path d="M5 25h12l-8 18H5a4 4 0 0 1-4-4V29a4 4 0 0 1 4-4Z" fill="#F86126"/>
        <rect x="22" y="17" width="6" height="16" rx="1.5" fill="#FFFFFF"/>
        <rect x="17" y="22" width="16" height="6" rx="1.5" fill="#FFFFFF"/>
        <rect x="23" y="18" width="4" height="14" rx="1" fill="#1AD3BB"/>
        <rect x="18" y="23" width="14" height="4" rx="1" fill="#1AD3BB"/>
      </svg>
    </g>

    <!-- Main Title -->
    <text x="0" y="55" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Mangotek Health Suite</text>
    <!-- Subtitle -->
    <text x="0" y="88" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Enterprise Hospital Information System (HIS) &amp; Electronic Medical Records (EMR) for Odoo 18
    </text>
  </g>

  <!-- 5. THREE FEATURE PILLARS -->
  <g transform="translate(600, 310)">
    <!-- Pillar 1: Clinical EMR & Ward -->
    <g transform="translate(-360, 0)">
      <rect x="-160" y="-45" width="320" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="-135" y="-15" font-size="16" font-weight="700" fill="#FFFFFF">🩺 Clinical EMR &amp; Wards</text>
      <text x="-135" y="12" font-size="12" fill="#94A3B8">Universal SOAP · Vital Signs · Bed BOR</text>
      <text x="-135" y="28" font-size="11" font-weight="600" fill="#1AD3BB">Multi-Tier: Solo · Clinic · Hospital</text>
    </g>

    <!-- Pillar 2: Integrated Billing & Finance -->
    <g transform="translate(0, 0)">
      <rect x="-160" y="-45" width="320" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="-135" y="-15" font-size="16" font-weight="700" fill="#FFFFFF">💳 Hospital Billing Ledger</text>
      <text x="-135" y="12" font-size="12" fill="#94A3B8">Doctor Fee Split · Dynamic QRIS · e-Stamp</text>
      <text x="-135" y="28" font-size="11" font-weight="600" fill="#FBB945">Syncs to account.move in odoo-finance</text>
    </g>

    <!-- Pillar 3: SatuSehat & BPJS -->
    <g transform="translate(360, 0)">
      <rect x="-160" y="-45" width="320" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="-135" y="-15" font-size="16" font-weight="700" fill="#FFFFFF">🛡️ SatuSehat &amp; BPJS Ready</text>
      <text x="-135" y="12" font-size="12" fill="#94A3B8">Kemenkes FHIR REST · PCare · VClaim 2.0</text>
      <text x="-135" y="28" font-size="11" font-weight="600" fill="#088BF5">Async Outbox Queue (Zero Freeze)</text>
    </g>
  </g>

  <!-- 6. FOOTER DIVIDER & TAGS -->
  <line x1="80" y1="535" x2="1120" y2="535" stroke="#334155" stroke-opacity="0.6"/>

  <g transform="translate(600, 575)">
    <text x="-520" y="5" font-size="13" font-weight="600" fill="#94A3B8">Mangotek Healthcare Cloud · billing@ppti.me</text>
    
    <!-- Version Pill -->
    <g transform="translate(410, 0)">
      <rect x="-110" y="-15" width="220" height="30" rx="15" fill="#714B67" stroke="#A06E91" stroke-width="1"/>
      <text x="0" y="5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Odoo 18.0 · 19.0 · 20.0</text>
    </g>
  </g>
</svg>